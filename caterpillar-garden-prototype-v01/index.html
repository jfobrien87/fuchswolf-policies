<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#f6f2e7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Eight quiet shape and colour puzzles for little hands. Lead the caterpillar to the door and discover the next puzzle. Plays offline after its first full load.">
  <title>Caterpillar Garden</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='9' cy='21' r='7' fill='%2388a348'/%3E%3Ccircle cx='18' cy='19' r='8' fill='%235c8b40'/%3E%3Ccircle cx='25' cy='16' r='7' fill='%23d74d35'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main aria-label="Caterpillar shape matching game">
    <canvas id="game" width="1280" height="800" aria-label="Match the shapes and colours to their sockets, then lead the caterpillar into the open door to play the next puzzle.">A shape and colour matching game. Please use a browser with canvas support.</canvas>
    <p id="load-error" role="alert" hidden>The garden couldn’t load. Please reconnect and reload once.</p>
  </main>
  <script type="module" src="game.js"></script>
</body>
</html>
