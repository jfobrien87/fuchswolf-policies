<!doctype html><meta charset="utf-8" /><title>Offline cache verification</title
><button id="run">Check offline asset cache</button>
<pre id="result">Ready</pre>
<script type="module">
  import { offlineStatus } from "../offline.js";
  document.querySelector("#run").onclick = async () => {
    const out = document.querySelector("#result");
    try {
      const registration = await navigator.serviceWorker.register("../sw.js", {
        scope: "../",
        updateViaCache: "none",
      });
      await registration.update();
      await navigator.serviceWorker.ready;
      const info = await offlineStatus();
      out.textContent =
        (info.ready ? "PASS" : "NOT READY") +
        " " +
        JSON.stringify(info, null, 2);
    } catch (e) {
      out.textContent = "FAIL " + e.message;
    }
  };
</script>
